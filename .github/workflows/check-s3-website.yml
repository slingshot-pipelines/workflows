name: check-s3-website

on:

  workflow_call:
    inputs:
      COMPONENT:
        type: string
        required: true
      TERRAFORM_VERSION:
        type: string
        required: false
        description: Required when the component declares `subpaths`, since the infrastructure is then checked
      TERRAGRUNT_VERSION:
        type: string
        required: false
        description: Required when the component declares `subpaths`, since the infrastructure is then checked
    secrets:
      WRITER_APP_CLIENT_ID:
        required: false
      WRITER_APP_PRIVATE_KEY:
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:

  lint-test-build:
    name: (${{ inputs.COMPONENT }}) lint-test-build
    outputs:
      has-infra: ${{ steps.extract-component-info.outputs.has-infra }}
      build-cache-key: ${{ steps.pick-build-cache-params.outputs.cache-key }}
      build-cache-path: ${{ steps.pick-build-cache-params.outputs.cache-path }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Fetch app token
        id: fetch-app-token
        uses: slingshot-pipelines/action-optional-app-token@v0
        with:
          CLIENT_ID: ${{ secrets.WRITER_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.WRITER_APP_PRIVATE_KEY }}
      -
        uses: actions/checkout@v7
        with:
          token: ${{ steps.fetch-app-token.outputs.token || github.token }}
      -
        name: Get component info
        id: component-info
        uses: slingshot-pipelines/action-component-info@v1
        with:
          component: ${{ inputs.COMPONENT }}
      -
        name: Extract component paths
        id: extract-component-info
        env:
          COMPONENT_INFO: ${{ steps.component-info.outputs.info }}
          TERRAFORM_VERSION: ${{ inputs.TERRAFORM_VERSION }}
          TERRAGRUNT_VERSION: ${{ inputs.TERRAGRUNT_VERSION }}
        run: |
          COMPONENT_PATH=$(echo "$COMPONENT_INFO" | jq -rc '.path // ""')
          if [[ -z "$COMPONENT_PATH" ]]; then
            >&2 echo "Could not determine component path"
            exit 1
          fi

          echo "path=$COMPONENT_PATH" | tee -a "$GITHUB_OUTPUT"

          HAS_SUBPATHS=$(echo "$COMPONENT_INFO" | jq -rc 'has("subpaths") and (.subpaths != null)')
          if [[ "$HAS_SUBPATHS" == "true" ]]; then
            SRC_SUBPATH=$(echo "$COMPONENT_INFO" | jq -rc '.subpaths.src // ""')
            BUILD_SUBPATH=$(echo "$COMPONENT_INFO" | jq -rc '.subpaths.build // ""')
            if [[ -z "$SRC_SUBPATH" || -z "$BUILD_SUBPATH" ]]; then
              >&2 echo "Could not determine source and build subpaths"
              exit 1
            fi

            if [[ -z "$TERRAFORM_VERSION" || -z "$TERRAGRUNT_VERSION" ]]; then
              >&2 echo "TERRAFORM_VERSION and TERRAGRUNT_VERSION are required for components with subpaths"
              exit 1
            fi

            SRC_PATH="$COMPONENT_PATH/$SRC_SUBPATH"
            BUILD_PATH="$COMPONENT_PATH/$BUILD_SUBPATH"
          else
            # Without subpaths, the source is the component path and the build output is dist
            SRC_PATH="$COMPONENT_PATH"
            BUILD_PATH="$COMPONENT_PATH/dist"
          fi

          # actions/setup-node doesn't support relative paths (e.g. when the
          # component path is "."), so resolve the source to an absolute path
          # with no relative segments
          SRC_PATH=$(realpath -m "$GITHUB_WORKSPACE/$SRC_PATH")

          {
            echo "src-path=$SRC_PATH";
            echo "build-path=$BUILD_PATH";
            echo "has-infra=$HAS_SUBPATHS";
          } | tee -a "$GITHUB_OUTPUT"
      -
        name: Check Makefile targets
        id: check-make-targets
        working-directory: ${{ steps.extract-component-info.outputs.src-path }}
        env:
          OPTIONAL_TARGETS: |
            lint
            unit-test
        run: |
          FOUND_TARGETS='[]'
          while IFS='' read -r TARGET && [[ -n "$TARGET" ]]; do
            if make -q "$TARGET" 2>/dev/null; (( $? < 2 )); then
              FOUND_TARGETS=$(echo "$FOUND_TARGETS" \
                | jq -rc \
                  --arg target "$TARGET" \
                  '. += [$target]')

              echo "${TARGET}: found"
            else
              echo "${TARGET}: not found"
            fi
          done <<< "$OPTIONAL_TARGETS"

          echo "Found targets: ${FOUND_TARGETS}"
          echo "found-targets=${FOUND_TARGETS}" >> "$GITHUB_OUTPUT"
      -
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ steps.extract-component-info.outputs.src-path }}/package.json
          cache: npm
          cache-dependency-path: ${{ steps.extract-component-info.outputs.src-path }}/package-lock.json
      -
        name: Install dependencies
        working-directory: ${{ steps.extract-component-info.outputs.src-path }}
        run: |
          npm ci
      -
        name: Lint source code
        working-directory: ${{ steps.extract-component-info.outputs.src-path }}
        if: ${{ contains(fromJSON(steps.check-make-targets.outputs.found-targets), 'lint') }}
        run: |
          make lint
      -
        name: Detect changes
        id: detect-changes
        shell: bash
        run: |
          # Check for generated changes

          git status -s

          if [ -n "$(git status -s)" ]; then
            echo "detected=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "detected=false" | tee -a "$GITHUB_OUTPUT"
          fi
      -
        name: Commit changes if detected
        if: ${{ steps.detect-changes.outputs.detected == 'true' }}
        uses: planetscale/ghcommit-action@v0.2.22
        env:
          GITHUB_TOKEN: ${{ steps.fetch-app-token.outputs.token || github.token }}
        with:
          commit_message: "lint ${{ inputs.COMPONENT }} source code"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
      -
        name: Fail if changes
        shell: bash
        if: ${{ steps.detect-changes.outputs.detected == 'true' }}
        working-directory: ${{ steps.extract-component-info.outputs.src-path }}
        run: |
          exit 1
      -
        name: Unit test
        if: ${{ contains(fromJSON(steps.check-make-targets.outputs.found-targets), 'unit-test') }}
        working-directory: ${{ steps.extract-component-info.outputs.src-path }}
        run: |
          make unit-test
      -
        name: Build
        working-directory: ${{ steps.extract-component-info.outputs.src-path }}
        run: |
          npm run build
      -
        name: Pick build cache parameters
        id: pick-build-cache-params
        if: ${{ steps.extract-component-info.outputs.has-infra == 'true' }}
        env:
          CACHE_KEY: ${{ inputs.COMPONENT }}-${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_DIR: ${{ steps.extract-component-info.outputs.build-path }}
        run: |
          echo "cache-key=$CACHE_KEY" | tee -a "$GITHUB_OUTPUT"
          echo "cache-path=$CACHE_DIR" | tee -a "$GITHUB_OUTPUT"
      -
        name: Cache build output
        if: ${{ steps.extract-component-info.outputs.has-infra == 'true' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.pick-build-cache-params.outputs.cache-key }}
          path: ${{ steps.pick-build-cache-params.outputs.cache-path }}

  check-infra:
    name: (${{ inputs.COMPONENT }}) check-infra
    needs:
      - lint-test-build
    if: ${{ needs.lint-test-build.outputs.has-infra == 'true' }}
    uses: slingshot-pipelines/workflows/.github/workflows/check-terragrunt-infra.yml@check-terragrunt-infra/v0
    with:
      TERRAFORM_VERSION: ${{ inputs.TERRAFORM_VERSION }}
      TERRAGRUNT_VERSION: ${{ inputs.TERRAGRUNT_VERSION }}
      COMPONENT: ${{ inputs.COMPONENT }}
      ALL: true
      BUILD_CACHE_KEY: ${{ needs.lint-test-build.outputs.build-cache-key }}
      BUILD_CACHE_PATH: ${{ needs.lint-test-build.outputs.build-cache-path }}
    secrets: inherit

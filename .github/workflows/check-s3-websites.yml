name: check-s3-websites

on:

  workflow_call:
    inputs:
      COMPONENTS:
        type: string
        required: true
      TERRAFORM_VERSION:
        type: string
        required: false
      TERRAGRUNT_VERSION:
        type: string
        required: false
    secrets:
      WRITER_APP_CLIENT_ID:
        required: false
      WRITER_APP_PRIVATE_KEY:
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:

  check-s3-website:
    strategy:
      matrix:
        COMPONENT: ${{ fromJSON(inputs.COMPONENTS) }}
    uses: slingshot-pipelines/workflows/.github/workflows/check-s3-website.yml@check-s3-website/v0
    with:
      COMPONENT: ${{ matrix.COMPONENT }}
      TERRAFORM_VERSION: ${{ inputs.TERRAFORM_VERSION }}
      TERRAGRUNT_VERSION: ${{ inputs.TERRAGRUNT_VERSION }}
    secrets: inherit

name: check-terragrunt-infras

on:
  workflow_call:
    inputs:
      COMPONENTS:
        type: string
        required: true
      TERRAFORM_VERSION:
        type: string
        required: true
      TERRAGRUNT_VERSION:
        type: string
        required: true
    secrets:
      READER_APP_CLIENT_ID:
        required: false
      READER_APP_PRIVATE_KEY:
        required: false
      WRITER_APP_CLIENT_ID:
        required: false
      WRITER_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:

  check-terragrunt-infra:
    strategy:
      matrix:
        COMPONENT: ${{ fromJSON(inputs.COMPONENTS) }}
    uses: slingshot-pipelines/workflows/.github/workflows/check-terragrunt-infra.yml@check-terragrunt-infra/v0
    with:
      COMPONENT: ${{ matrix.COMPONENT }}
      TERRAFORM_VERSION: ${{ inputs.TERRAFORM_VERSION }}
      TERRAGRUNT_VERSION: ${{ inputs.TERRAGRUNT_VERSION }}
    secrets:
      READER_APP_CLIENT_ID: ${{ secrets.READER_APP_CLIENT_ID }}
      READER_APP_PRIVATE_KEY: ${{ secrets.READER_APP_PRIVATE_KEY }}
      WRITER_APP_CLIENT_ID: ${{ secrets.WRITER_APP_CLIENT_ID }}
      WRITER_APP_PRIVATE_KEY: ${{ secrets.WRITER_APP_PRIVATE_KEY }}
